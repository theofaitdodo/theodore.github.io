<!doctype html>
<html>
  <head>
    <title>Carte Interactive</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #chartdiv {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- amCharts 5 -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/canadaLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/usaLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <script>
      am5.ready(function () {
        // Create root element
        var root = am5.Root.new("chartdiv");

        // Set themes
        root.setThemes([
          am5themes_Animated.new(root)
        ]);

        // Create map chart
        var chart = root.container.children.push(
          am5map.MapChart.new(root, {
            panX: "rotateX",
            panY: "rotateY",
            projection: am5map.geoOrthographic(),
          })
        );

        chart.animate({
          key: "rotationX",
          from: 0,
          to: 70,
          duration: 1000,
          easing: am5.ease.inOut(am5.ease.cubic)
        });
        chart.animate({
          key: "rotationY",
          from: 0,
          to: -53,
          duration: 1000,
          easing: am5.ease.inOut(am5.ease.cubic)
        });

        // Create polygon series for the world
        var worldSeries = chart.series.push(
          am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_worldLow,
            exclude: ["AQ", "CA", "US"], // Exclude Antarctica, Canada and US
            fill: am5.color(0xcccccc), // Grey color for the world
          })
        );

        // Create polygon series for Canada
        var canadaSeries = chart.series.push(
          am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_canadaLow,
            include: ["CA-AB", "CA-BC", "CA-MB", "CA-NB", "CA-NL", "CA-NS", "CA-NT", "CA-NU", "CA-ON", "CA-PE", "CA-SK", "CA-YT"],
            fill: am5.color(0xff6666),
            stroke: am5.color(0x000000),
          })
        );

        // Create polygon series for US
        var usaSeries = chart.series.push(
          am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_usaLow,
            fill: am5.color(0xd3a6a6),
            stroke: am5.color(0x000000),
          })
        );

        // Create polygon series for Quebec
        var quebecSeries = chart.series.push(
          am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_canadaLow,
            include: ["CA-QC"],
            fill: am5.color(0x003da5),
            stroke: am5.color(0x000000),
          })
        );

        // Create point series for cities
        var pointSeries = chart.series.push(
          am5map.MapPointSeries.new(root, {
            latitudeField: "lat",
            longitudeField: "lon",
          })
        );

        pointSeries.bullets.push(function (root, series, dataItem) {
          let circle = am5.Circle.new(root, {
            radius: 5,
            fill: am5.color(dataItem.dataContext.color),
            stroke: am5.color(0x000000),
            strokeWidth: 1,
            cursorOverStyle: "pointer",
            tooltipHTML: `
              <div style="font-size: 16px; color: #000000; background-color: #f0f0f0; border: 1px solid black; border-radius: 10px; padding: 10px;">
                <b>{title}</b><br>
                <ul>
                  <li><b>Population:</b> {population}</li>
                  <li><b>Fondation:</b> {foundation}</li>
                </ul>
              </div>
            `
          });

          circle.events.on("click", function(ev) {
            ev.target.get("tooltip").show();
          });

          return am5.Bullet.new(root, {
            sprite: circle
          });
        });

        var cities = [
          {
            title: "Montreal",
            lat: 45.508888,
            lon: -73.561668,
            population: "1,800,055",
            foundation: "1642",
            color: 0xa50000
          },
          {
            title: "Québec",
            lat: 46.81389,
            lon: -71.20806,
            population: "566,066",
            foundation: "1608",
            color: 0x0000ff
          },
          {
            title: "Gatineau",
            lat: 45.4772,
            lon: -75.7016,
            population: "292,281",
            foundation: "2002",
            color: 0xa50000
          },
          {
            title: "Sherbrooke",
            lat: 45.4001,
            lon: -71.8991,
            population: "175,114",
            foundation: "1818",
            color: 0xa50000
          },
          {
            title: "Saguenay",
            lat: 48.4167,
            lon: -71.0657,
            population: "147,952",
            foundation: "2002",
            color: 0xa50000
          },
          {
            title: "Trois-Rivières",
            lat: 46.35,
            lon: -72.55,
            population: "142,598",
            foundation: "1634",
            color: 0xa50000
          },
          {
            title: "Varsovie",
            lat: 52.2297,
            lon: 21.0122,
            population: "1,800,000",
            foundation: "1300",
            color: 0xa50000
          },
          {
            title: "Poznan",
            lat: 52.4064,

            population: "546,859",
            foundation: "1253",
            color: 0x0000ff
          },
          {
            title: "Torun",
            lat: 53.0138,
            lon: 18.5981,
            population: "201,447",
            foundation: "1233",
            color: 0xa50000
          },
          {
            title: "Gdansk",
            lat: 54.3520,
            lon: 18.6466,
            population: "470,907",
            foundation: "997",
            color: 0xa50000
          },
          {
            title: "Cracovie",
            lat: 50.0647,
            lon: 19.9450,
            population: "779,115",
            foundation: "7th century",
            color: 0xa50000
          },
          {
            title: "Wroclaw",
            lat: 51.1079,

            population: "641,607",
            foundation: "940",
            color: 0xa50000
          },
          {
            title: "Berlin",

          },
          {

            color: 0xa50000
          },
          {

            color: 0xa50000
          },
          {

          },
          {

          },
          {

          },
          {
            title: "New York",
            lat: 40.7128,

          },
          {

          {

          },
          {

            color: 0xa50000
          },
          {
            title: "Charlottetown",
            lat: 46.2382,

            color: 0xa50000
          },
          {
            title: "Burlington",
            lat: 44.4759,
            lon: -73.2121,
            population: "44,743",
            foundation: "1763",
            color: 0xa50000
          },
          {
            title: "Bath",
            lat: 43.9105,
            lon: -69.8169,
            population: "8,764",
            foundation: "1781",
            color: 0xa50000
          },
          {
            title: "Gaspé",
            lat: 48.8333,
            lon: -64.4819,
            population: "15,063",
            foundation: "1534",
            color: 0xa50000
          },
          {
            title: "Tadoussac",
            lat: 48.1448,
            lon: -69.7128,
            population: "814",
            foundation: "1599",
            color: 0xa50000
          },
          {
            title: "Rimouski",
            lat: 48.4488,
            lon: -68.5240,
            population: "48,935",
            foundation: "1696",
            color: 0xa50000
          }
        ];

        pointSeries.data.setAll(cities);

        // Add legend
        var legend = chart.children.push(am5.Legend.new(root, {
          nameField: "name",
          fillField: "color",
          strokeField: "color",
          x: am5.percent(0),
          y: am5.percent(95),
          layout: root.horizontalLayout
        }));

        legend.data.setAll([
          { name: "Endroits Habités", color: am5.color(0x0000ff) },
          { name: "Endroits visités", color: am5.color(0xa50000) }
        ]);

        // Add zoom control
        chart.set("zoomControl", am5map.ZoomControl.new(root, {}));
      });
    </script>
  </body>
</html>
